<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IEAH-APP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-principal: #1a5c2e;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
        }

        .login-body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--verde-principal), #0d3d1e);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card img {
            height: 80px;
            margin-bottom: 20px;
        }

        .login-card h2 {
            color: var(--verde-principal);
            margin-bottom: 10px;
            font-family: 'Montserrat';
        }

        .grupo-input {
            margin-bottom: 15px;
            text-align: left;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .grupo-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .boton-primario {
            background: var(--verde-principal);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
        }

        .boton-primario:hover {
            background: #247a3d;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: var(--verde-principal);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .mensaje-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }
    </style>
</head>

<body class="login-body">

    <div class="login-card">
        <img src="../img/logo.png" alt="Logo Colegio">
        <h2>IEAH-APP</h2>
        <p>Plataforma de Gestión Académica</p>

        <form id="loginForm">
            <div class="grupo-input">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ingresa@tu-correo.com" required>
            </div>
            <div class="grupo-input">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="boton-primario" id="btnIngresar">Ingresar</button>
            <p id="mensajeError" class="mensaje-error"></p>
        </form>

        <a href="../index.html" class="back-link">← Volver al sitio principal</a>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURA AQUÍ TUS CREDENCIALES DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAjZtbtNDCIQAh9OIQZ6bzMCX0QLQQQHe8",
            authDomain: "ieah-bienestar.firebaseapp.com",
            projectId: "ieah-bienestar",
            storageBucket: "ieah-bienestar.firebasestorage.app",
            messagingSenderId: "142124375725",
            appId: "1:142124375725:web:9522a9494107d50970b024",
            measurementId: "G-FXDJVHMHJH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const mensajeError = document.getElementById('mensajeError');
        const btnIngresar = document.getElementById('btnIngresar');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensajeError.style.display = 'none';
            btnIngresar.disabled = true;
            btnIngresar.textContent = 'Verificando...';

            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                // 1. Iniciar Sesión en Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, correo, password);
                const uid = userCredential.user.uid;

                // 2. Consultar el perfil del usuario en Firestore para conocer su Rol
                const docRef = doc(db, "usuarios", uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const datosUsuario = docSnap.data();
                    const rol = datosUsuario.rol;

                    // Guardar rol y estado en localStorage para apoyo local
                    localStorage.setItem('sesionIniciada', 'true');
                    localStorage.setItem('rolUsuario', rol);

                    // 3. Redirección unificada al Panel de Control para todos los roles
                    window.location.href = "panel.html";

                } else {
                    mostrarError("⚠️ El usuario no tiene un rol asignado en la base de datos.");
                }

            } catch (error) {
                console.error("Error en login:", error);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    mostrarError("⚠️ Correo o contraseña incorrectos.");
                } else {
                    mostrarError("❌ No se pudo conectar con Firebase. Revisa tu conexión.");
                }
            } finally {
                btnIngresar.disabled = false;
                btnIngresar.textContent = 'Ingresar';
            }
        });

        function mostrarError(texto) {
            mensajeError.textContent = texto;
            mensajeError.style.display = 'block';
        }
    </script>
</body>

</html>

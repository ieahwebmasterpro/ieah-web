<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Plataforma - IEAH</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/panel.css">
</head>

<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f4f6f9;">

    <div style="background:white; padding:35px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:100%; max-width:400px;">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="font-family:'Montserrat', sans-serif; color:var(--verde-principal); margin-bottom: 5px;">IEAH - Acceso</h2>
            <p style="font-size: 0.85rem; color: #666;">Ingresa tus credenciales para continuar</p>
        </div>

        <form id="formLogin">
            <div class="grupo" style="margin-bottom:15px;">
                <label>Correo Electrónico</label>
                <input type="email" id="loginCorreo" placeholder="correo@ieah.edu.co" required>
            </div>

            <div class="grupo" style="margin-bottom:20px;">
                <label>Contraseña</label>
                <input type="password" id="loginClave" placeholder="******" required>
            </div>

            <button type="submit" id="btnLogin" class="btn-guardar" style="width:100%; padding: 12px;">Ingresar al Panel</button>
        </form>

        <div style="margin-top:20px; text-align:center;">
            <a href="../index.html" style="color: var(--verde-principal); font-size: 0.85rem; text-decoration: none;">← Volver al sitio principal</a>
        </div>
    </div>

    <!-- Script en Módulo -->
    <script type="module" src="js/login.js"></script>
</body>

</html>

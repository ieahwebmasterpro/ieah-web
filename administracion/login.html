<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEAH-APP | Inicio de Sesión</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Independiente -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-card">
        <!-- Enlace Volver en la esquina superior izquierda -->
        <a href="/index.html" class="btn-volver-top">← Volver</a>

        <!-- Escudo Institucional Cuadrado con bordes suaves -->
        <div class="escudo-contenedor">
            <img src="../img/escudo.png" alt="Escudo IEAH" class="escudo-img" onerror="this.src='https://via.placeholder.com/140?text=ESCUDO+IEAH'">
        </div>

        <!-- Títulos -->
        <h1 class="app-title">IEAH-APP</h1>
        <p class="app-subtitle">PLATAFORMA DE GESTIÓN ACADÉMICA</p>

        <!-- Mensaje de error -->
        <div id="lblError" class="error-message"></div>

        <!-- Formulario de Iniciar Sesión -->
        <form id="formLogin">
            <div class="form-group">
                <label for="txtCorreo">Correo Electrónico</label>
                <div class="input-box">
                    <input type="email" id="txtCorreo" placeholder="ejemplo@sedhuila.gov.co" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="txtClave">Contraseña</label>
                <div class="input-box">
                    <input type="password" id="txtClave" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btnIngresar" class="btn-login">Ingresar al Sistema</button>
        </form>

        <!-- Pie de página elevado y reorganizado con copyright -->
        <div class="card-footer">
            Institución Educativa Alto Horizonte<br><br>
            <span>&copy; CEMLED Corp <br>2026</span>
        </div>
    </div>

    <!-- JS Independiente -->
    <script type="module" src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Pagos - IEAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/consultas.css">
    
    <!-- Librerías jsPDF y AutoTable para la descarga en formato Matriz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

    <div class="container">
        <!-- Contenedor dinámico del botón de regresar -->
        <div id="contenedorBtnVolver" style="margin-bottom: 15px;">
            <a href="panel.html" class="btn-volver">⬅️ Volver al Panel</a>
        </div>

        <h2>🔍 Consulta Individual de Pagos</h2>

        <form class="form-busqueda" id="formBusqueda">
            <input type="password" id="inputBuscar" placeholder="Ingrese su número de identificación privado..." autocomplete="off" required>
            <button type="submit">Buscar</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Ticket N°</th>
                    <th>Fecha</th>
                    <th>Docente</th>
                    <th>Meses Pagados</th>
                    <th>Total</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaConsulta">
                <tr>
                    <td colspan="6" style="text-align: center;">Ingrese su número de identificación para realizar la búsqueda.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="contenedorPDF"></div>

    <!-- Firebase SDK Modular y Script principal -->
    <script type="module" src="js/consultas.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Egresos - IEAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/egresos.css">

    <!-- Librerías jsPDF y AutoTable para la generación del reporte PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

    <div class="container">
        <div class="header-acciones">
            <a href="panel.html" class="btn-volver">⬅️ Volver al Panel</a>
            <button id="btnDescargarPDF" class="btn-pdf-general">📄 Descargar Reporte PDF</button>
        </div>

        <h2>📊 Control de Egresos y Balance General</h2>

        <!-- Resumen de Balance Financiero -->
        <div class="resumen-cards">
            <div class="card card-ingresos">
                <h3>Total Ingresos</h3>
                <p id="lblIngresos">$0</p>
            </div>
            <div class="card card-egresos">
                <h3>Total Egresos</h3>
                <p id="lblEgresos">$0</p>
            </div>
            <div class="card card-saldo">
                <h3>Saldo Actual</h3>
                <p id="lblSaldo">$0</p>
            </div>
        </div>

        <!-- Formulario para agregar nuevo egreso -->
        <div class="formulario-egreso" id="contenedorFormEgreso">
            <h3>💸 Registrar Nuevo Egreso</h3>
            <form id="formEgreso" class="form-group">
                <input type="date" id="fechaEgreso" required>
                <input type="text" id="conceptoEgreso" placeholder="Concepto (ej. Torta de cumpleaños)" required>
                <input type="number" id="valorEgreso" placeholder="Valor ($)" min="1" required>
                <button type="submit" class="btn-guardar">➕ Registrar</button>
            </form>
        </div>

        <!-- Tabla de Movimientos de Egresos -->
        <h3>📋 Descripción de Egresos</h3>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Concepto</th>
                    <th>Valor</th>
                    <th class="col-accion">Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaEgresos">
                <tr>
                    <td colspan="4" style="text-align: center;">Cargando movimientos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Firebase SDK Modular y Script principal -->
    <script type="module" src="js/egresos.js"></script>
</body>

</html>
